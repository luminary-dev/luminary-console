# Tags a release whenever package.json's version changes on main (skips with
# a notice if the tag already exists) — same convention as the landing repo.
name: Release · Tag
run-name: "Release · Tag · ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  tag:
    name: Tag & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Create the release for the current version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(jq -r .version package.json)"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::notice::$VERSION already tagged — skipping."
            exit 0
          fi
          gh release create "$VERSION" --generate-notes --title "$VERSION"
