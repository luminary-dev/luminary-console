# Merge gate: lint, typecheck, unit tests with coverage, then build. Vercel
# still does the deploying — this tells you, on GitHub, whether the commit is
# sound. Failures on main ping Telegram.
#
# Naming convention (all workflows): see README "GitHub Actions" —
#   workflow "Area · Action" · run-name adds runtime context · jobs are
#   "N · Verb phrase" (or a plain verb phrase when single) · every step is
#   explicitly named. The job name "Build" is a required status check in the
#   main-pr-only ruleset — rename both together or not at all.
name: CI
run-name: "CI · ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: 1 · Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & component tests with coverage
        run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build & typecheck
        run: npm run build
      - name: Notify Telegram of the failure
        if: failure() && github.event_name == 'push'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="Console CI failed on main: ${{ github.event.head_commit.message }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null

  security:
    name: 2 · Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
