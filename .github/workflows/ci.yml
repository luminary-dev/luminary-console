# Merge gate + visibility: build (includes the TypeScript pass) on every PR
# and every push to main. Vercel still does the deploying — this only tells
# you, on GitHub, whether the commit is sound. Failures on main ping Telegram.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Telegram alert on failure
        if: failure() && github.event_name == 'push'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="🔴 console CI failed on main: ${{ github.event.head_commit.message }} — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
