# Merge gate: lint, typecheck, unit tests with coverage, then build. Vercel
# still does the deploying — this tells you, on GitHub, whether the commit is
# sound. Failures on main ping Telegram.
#
# Naming convention (all workflows): see README "GitHub Actions" —
#   workflow "Area · Action" · run-name adds runtime context · jobs are
#   "N · Verb phrase" (or a plain verb phrase when single) · every step is
#   explicitly named. The job name "Build" is a required status check in the
#   main-pr-only ruleset — rename both together or not at all.
name: CI
run-name: "CI · ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: 1 · Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & component tests with coverage
        run: npm run test:coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build & typecheck
        run: npm run build
      - name: Notify Telegram of the failure
        if: failure() && github.event_name == 'push'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The commit message arrives through the ENVIRONMENT, never through
          # `${{ }}` interpolation into the script. Interpolation splices the
          # raw text into the command before bash parses it, so a commit
          # message containing $(...) or backticks executes on a runner that
          # holds every secret above. actionlint flags this; it is why the
          # lint job exists.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ]; then
            exit 0
          fi
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="Console CI failed on main: ${COMMIT_MESSAGE} ${RUN_URL}" \
            > /dev/null

  workflows:
    name: 3 · Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      # actionlint validates the workflow schema, expression syntax, action
      # references and runner labels, AND it runs shellcheck over every
      # `run:` block when shellcheck is on PATH. One tool, both jobs.
      #
      # It earns its place: the first run flagged a script injection in this
      # very file, where a commit message was interpolated straight into a
      # curl command on a runner holding every secret the pipeline has.
      #
      # An honest note on the limit. This would NOT have caught LC-089, the
      # SIGPIPE-under-pipefail bug that failed every article publish after it
      # had already succeeded: shellcheck returns clean on that pattern,
      # verified directly. Static analysis of shell is a floor, not a
      # guarantee, and pipeline bugs still need a real run to find.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: 0.11.0
        run: |
          set -euo pipefail
          ASSET="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL -O "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${ASSET}"
          tar -xJf "${ASSET}"
          sudo install "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          ASSET="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSfL -O "${BASE}/${ASSET}"
          curl -sSfL -O "${BASE}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${ASSET}$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${ASSET}" actionlint
          sudo install actionlint /usr/local/bin/actionlint
          actionlint --version
      - name: Lint workflows and their shell
        run: actionlint

  security:
    name: 2 · Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Full history: the secret scan below reads commits, and the default
          # shallow clone would hand it one, so a secret added in any earlier
          # commit would pass unnoticed.
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      # The gitleaks TOOL is open source and free. The gitleaks ACTION refuses
      # to run for a GitHub organization without a paid GITLEAKS_LICENSE, which
      # failed this job on every push. Running the binary directly keeps the
      # secret scan and drops the licence requirement. The version is pinned
      # and the checksum is verified, because a scanner that silently becomes
      # a different program is worse than no scanner.
      - name: Scan for committed secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Kept under its published name so the checksum line matches the file
          # on disk; renaming it makes `sha256sum -c` look for a file that is
          # not there and the verification silently has nothing to check.
          curl -sSfL -O "${BASE}/${ASSET}"
          curl -sSfL -O "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${ASSET}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${ASSET}" gitleaks
          # `git`, not `dir`: scan what is committed. `dir` walks the working
          # tree including gitignored build output, and .next/cache holds real
          # token values baked in at build time, so it reports 25 findings that
          # are not in the repository and cannot be.
          # --redact so a finding never prints the secret into a public log.
          ./gitleaks git . --redact --verbose --exit-code 1
          rm -f "${ASSET}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" gitleaks
